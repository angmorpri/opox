[project]
authors = [
  {name = "angmorpri", email = "angelmorenoprieto@gmail.com"},
]
dependencies = [
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.6",
]
description = "Core of Project OPO - Artificial Intelligence for Spain's Civil Servant Exams"
name = "opox"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
opox = "opox.cli:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.23,<0.13.0"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
